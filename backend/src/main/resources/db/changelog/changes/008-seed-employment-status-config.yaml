databaseChangeLog:

  - changeSet:
      id: 008-seed-student-employment-status-v2
      author: neo-01
      comment: Seed version 2 for CREDIT_CARD_STUDENT with employment status restriction
      changes:
        - insert:
            tableName: product_config
            columns:
              - column: { name: product_code, value: 'CREDIT_CARD_STUDENT' }
              - column: { name: version, valueNumeric: 2 }
              - column: { name: min_age, valueNumeric: 18 }
              - column: { name: limit_min, valueNumeric: 500 }
              - column: { name: limit_max, valueNumeric: 3000 }
              - column: { name: active, valueBoolean: true }
              - column: { name: channels, value: 'WEB,MOBILE_APP' }
