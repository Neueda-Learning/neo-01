      author: neo-01
      comment: Seed version 6 for CREDIT_CARD_REWARDS — fix limit range to 500-10000 per scenario corpus
      changes:
        - insert:
            tableName: product_config
            columns:
              - column: { name: product_code, value: 'CREDIT_CARD_REWARDS' }
