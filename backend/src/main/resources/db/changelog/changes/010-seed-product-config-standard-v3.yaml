databaseChangeLog:

  - changeSet:
      id: 010-seed-product-config-standard-v3
      author: neo-01
      comment: Seed version 3 for CREDIT_CARD_STANDARD — add BRANCH channel for SIM-12
      changes:
        - insert:
            tableName: product_config
            columns:
              - column: { name: product_code, value: 'CREDIT_CARD_STANDARD' }
