# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-verification-case.yaml
  - include:
      file: db/changelog/changes/003-drop-demo-showcase.yaml
  - include:
      file: db/changelog/changes/004-seed-product-config.yaml
  - include:
      file: db/changelog/changes/005-add-full-name.yaml
  - include:
      file: db/changelog/changes/006-seed-product-config-rewards-history.yaml
  - include:
      file: db/changelog/changes/007-add-employment-status-config.yaml
  - include:
      file: db/changelog/changes/008-seed-employment-status-config.yaml
  - include:
      file: db/changelog/changes/009-seed-product-config-rewards-v6.yaml
  - include:
      file: db/changelog/changes/010-seed-product-config-standard-v3.yaml